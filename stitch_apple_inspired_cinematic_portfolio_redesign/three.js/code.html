<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js 3D Studio PC / Workstation Model for DaVinci Resolve Editor
const container = document.getElementById('pc-3d-container') || document.querySelector('.threejs-container') || document.body;
const width = container.clientWidth || 800;
const height = container.clientHeight || 500;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 1.8, 4.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// Lighting setup - Apple Pro Cinematic Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(3, 5, 4);
keyLight.castShadow = true;
scene.add(keyLight);

const blueRimLight = new THREE.DirectionalLight(0x2997ff, 3.5);
blueRimLight.position.set(-4, 3, -2);
scene.add(blueRimLight);

const purpleFillLight = new THREE.PointLight(0xa855f7, 1.8, 10);
purpleFillLight.position.set(0, 0.5, 2);
scene.add(purpleFillLight);

// Group to hold entire computer desk/workstation
const pcGroup = new THREE.Group();
scene.add(pcGroup);

// Materials
const darkMetalMaterial = new THREE.MeshStandardMaterial({
  color: 0x18181c,
  roughness: 0.25,
  metalness: 0.85
});

const silverAluminumMaterial = new THREE.MeshStandardMaterial({
  color: 0xd0d4dc,
  roughness: 0.2,
  metalness: 0.9
});

const glassScreenMaterial = new THREE.MeshStandardMaterial({
  color: 0x050508,
  roughness: 0.1,
  metalness: 0.5
});

// Glowing Screen display (simulating DaVinci Resolve Timeline / Scopes UI)
const canvas = document.createElement('canvas');
canvas.width = 1024;
canvas.height = 576;
const ctx = canvas.getContext('2d');

function updateScreenTexture() {
  // Deep dark editor background
  ctx.fillStyle = '#0f1015';
  ctx.fillRect(0, 0, 1024, 576);

  // Top header bar
  ctx.fillStyle = '#171922';
  ctx.fillRect(0, 0, 1024, 42);
  ctx.fillStyle = '#2997ff';
  ctx.fillRect(20, 14, 14, 14);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('DaVinci Resolve Studio 19 — Prince Color Grade // Node Graph Pipeline', 45, 26);
  ctx.fillStyle = '#10b981';
  ctx.fillText('● Rec.709 Live Calibrated', 820, 26);

  // Split view: Left Video Preview, Right Color Scopes & Node Graph
  // Video preview box
  ctx.fillStyle = '#08080a';
  ctx.fillRect(20, 56, 560, 310);
  // Stylized cinematic gradient preview in viewer
  const grad = ctx.createLinearGradient(20, 56, 580, 366);
  grad.addColorStop(0, '#1e3a8a');
  grad.addColorStop(0.5, '#0ea5e9');
  grad.addColorStop(1, '#f97316');
  ctx.fillStyle = grad;
  ctx.fillRect(35, 70, 530, 280);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('CINEMATIC 4K HDR MASTER', 60, 200);
  ctx.font = '14px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText('3840 x 2160 | 24.000 fps | Arri LogC3 to Rec.709', 60, 230);

  // Right Side: Color Scopes & Waveforms
  ctx.fillStyle = '#14161f';
  ctx.fillRect(600, 56, 404, 310);
  // RGB Parade / Waveform simulation
  ctx.strokeStyle = '#2997ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for(let i=0; i<380; i+=10) {
    const y = 200 + Math.sin(i*0.05 + Date.now()*0.003)*45 + Math.random()*8;
    if(i===0) ctx.moveTo(612+i, y);
    else ctx.lineTo(612+i, y);
  }
  ctx.stroke();

  // Bottom Timeline Tracks
  ctx.fillStyle = '#12131a';
  ctx.fillRect(20, 380, 984, 175);
  // Audio & Video tracks
  ctx.fillStyle = '#1d4ed8';
  ctx.fillRect(30, 395, 240, 32);
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(280, 395, 380, 32);
  ctx.fillStyle = '#2563eb';
  ctx.fillRect(670, 395, 320, 32);

  // Audio wave tracks below
  ctx.fillStyle = '#059669';
  ctx.fillRect(30, 435, 460, 28);
  ctx.fillRect(500, 435, 490, 28);

  // Playhead needle
  const playheadX = (Date.now() * 0.12) % 960 + 30;
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(playheadX, 380);
  ctx.lineTo(playheadX, 555);
  ctx.stroke();
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.moveTo(playheadX-6, 380);
  ctx.lineTo(playheadX+6, 380);
  ctx.lineTo(playheadX, 390);
  ctx.fill();
}

const screenTexture = new THREE.CanvasTexture(canvas);
const liveScreenMaterial = new THREE.MeshBasicMaterial({ map: screenTexture });

// 1. MONITOR SCREEN (Ultra-thin Apple Studio Display style)
// Outer bezel
const monitorBezelGeo = new THREE.BoxGeometry(2.4, 1.45, 0.05);
const monitorBezel = new THREE.Mesh(monitorBezelGeo, darkMetalMaterial);
monitorBezel.position.set(0, 0.45, 0);
pcGroup.add(monitorBezel);

// Active Screen display
const monitorScreenGeo = new THREE.PlaneGeometry(2.32, 1.36);
const monitorScreen = new THREE.Mesh(monitorScreenGeo, liveScreenMaterial);
monitorScreen.position.set(0, 0.45, 0.027);
pcGroup.add(monitorScreen);

// Monitor Stand (Apple aluminum L-stand)
const standArmGeo = new THREE.BoxGeometry(0.24, 0.85, 0.04);
const standArm = new THREE.Mesh(standArmGeo, silverAluminumMaterial);
standArm.position.set(0, 0.05, -0.15);
standArm.rotation.x = 0.15;
pcGroup.add(standArm);

const standBaseGeo = new THREE.BoxGeometry(0.55, 0.02, 0.48);
const standBase = new THREE.Mesh(standBaseGeo, silverAluminumMaterial);
standBase.position.set(0, -0.36, 0.05);
pcGroup.add(standBase);

// 2. PRO DESKTOP PC TOWER (Mac Pro / High-End Studio Workstation)
const towerGroup = new THREE.Group();
towerGroup.position.set(1.7, 0.1, -0.2);
pcGroup.add(towerGroup);

// Main Tower Chassis
const towerChassisGeo = new THREE.BoxGeometry(0.65, 1.15, 1.1);
const towerChassis = new THREE.Mesh(towerChassisGeo, silverAluminumMaterial);
towerGroup.add(towerChassis);

// Glass Side Panel with Internal Glow
const sideGlassGeo = new THREE.BoxGeometry(0.02, 1.05, 0.98);
const sideGlassMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a1128,
  metalness: 0.1,
  roughness: 0.05,
  transparent: true,
  opacity: 0.65,
  transmission: 0.6
});
const sideGlass = new THREE.Mesh(sideGlassGeo, sideGlassMat);
sideGlass.position.set(-0.33, 0, 0);
towerGroup.add(sideGlass);

// Internal GPU / Cooling LED glowing lines inside tower
const gpuBlockGeo = new THREE.BoxGeometry(0.25, 0.35, 0.65);
const gpuMat = new THREE.MeshStandardMaterial({ color: 0x222228, metalness: 0.9, roughness: 0.3 });
const gpuBlock = new THREE.Mesh(gpuBlockGeo, gpuMat);
gpuBlock.position.set(-0.05, -0.1, 0);
towerGroup.add(gpuBlock);

const ledLightGeo = new THREE.BoxGeometry(0.04, 0.04, 0.58);
const ledGlowMat = new THREE.MeshBasicMaterial({ color: 0x2997ff });
const ledLightStrip = new THREE.Mesh(ledLightGeo, ledGlowMat);
ledLightStrip.position.set(-0.2, -0.05, 0);
towerGroup.add(ledLightStrip);

// Front intake honeycomb / ports
const frontPlateGeo = new THREE.BoxGeometry(0.62, 1.12, 0.02);
const frontPlateMat = new THREE.MeshStandardMaterial({ color: 0x15161b, metalness: 0.7, roughness: 0.4 });
const frontPlate = new THREE.Mesh(frontPlateGeo, frontPlateMat);
frontPlate.position.set(0, 0, 0.56);
towerGroup.add(frontPlate);

// 3. KEYBOARD & MAGIC TRACKPAD / COLORIST CONTROLLER
const keyboardGeo = new THREE.BoxGeometry(0.9, 0.025, 0.32);
const keyboard = new THREE.Mesh(keyboardGeo, silverAluminumMaterial);
keyboard.position.set(-0.2, -0.37, 0.55);
keyboard.rotation.x = 0.06;
pcGroup.add(keyboard);

const keybedGeo = new THREE.BoxGeometry(0.86, 0.015, 0.28);
const keybedMat = new THREE.MeshStandardMaterial({ color: 0x181920, roughness: 0.4 });
const keybed = new THREE.Mesh(keybedGeo, keybedMat);
keybed.position.set(-0.2, -0.355, 0.55);
keybed.rotation.x = 0.06;
pcGroup.add(keybed);

// Colorist Precision Mouse / Trackball
const mouseGeo = new THREE.BoxGeometry(0.18, 0.05, 0.28);
const mouseMat = new THREE.MeshStandardMaterial({ color: 0x1c1d24, metalness: 0.4, roughness: 0.2 });
const mouse = new THREE.Mesh(mouseGeo, mouseMat);
mouse.position.set(0.48, -0.36, 0.55);
pcGroup.add(mouse);

// Glowing RGB Ring on mouse/trackball
const ringGeo = new THREE.RingGeometry(0.03, 0.045, 32);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x2997ff, side: THREE.DoubleSide });
const mouseRing = new THREE.Mesh(ringGeo, ringMat);
mouseRing.position.set(0.48, -0.334, 0.52);
mouseRing.rotation.x = -Math.PI / 2;
pcGroup.add(mouseRing);

// 4. STUDIO MONITORS / SPEAKERS (Pair on left and right)
function createSpeaker(xPos) {
  const spkGroup = new THREE.Group();
  spkGroup.position.set(xPos, 0.3, -0.05);
  
  const bodyGeo = new THREE.BoxGeometry(0.35, 0.65, 0.38);
  const spkBody = new THREE.Mesh(bodyGeo, darkMetalMaterial);
  spkGroup.add(spkBody);

  const coneGeo = new THREE.CylinderGeometry(0.1, 0.04, 0.05, 32);
  coneGeo.rotateX(Math.PI/2);
  const coneMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3 });
  const cone = new THREE.Mesh(coneGeo, coneMat);
  cone.position.set(0, -0.08, 0.18);
  spkGroup.add(cone);

  const tweeterGeo = new THREE.SphereGeometry(0.04, 16, 16);
  const tweetMat = new THREE.MeshStandardMaterial({ color: 0x2997ff, metalness: 0.8 });
  const tweeter = new THREE.Mesh(tweeterGeo, tweetMat);
  tweeter.position.set(0, 0.16, 0.18);
  spkGroup.add(tweeter);

  return spkGroup;
}
pcGroup.add(createSpeaker(-1.6));
pcGroup.add(createSpeaker(1.15));

// Desk Surface
const deskGeo = new THREE.BoxGeometry(4.4, 0.06, 2.0);
const deskMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.4, metalness: 0.3 });
const desk = new THREE.Mesh(deskGeo, deskMat);
desk.position.set(0, -0.4, 0.2);
pcGroup.add(desk);

// Mouse and movement interaction
let mouseX = 0;
let mouseY = 0;
let targetRotY = 0;
let targetRotX = 0;

function onPointerMove(e) {
  const rect = container.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * 2 - 1;
  const y = -((e.clientY - rect.top) / rect.height * 2 - 1);
  targetRotY = x * 0.45;
  targetRotX = -y * 0.2;
}

window.addEventListener('mousemove', onPointerMove);

// Resize handler
function onResize() {
  const newW = container.clientWidth || window.innerWidth;
  const newH = container.clientHeight || 500;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
}
window.addEventListener('resize', onResize);

// Animation Loop
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // Smooth rotation easing
  pcGroup.rotation.y += (targetRotY - pcGroup.rotation.y) * 0.05;
  pcGroup.rotation.x += (targetRotX - pcGroup.rotation.x) * 0.05;

  // Gentle ambient floating
  pcGroup.position.y = Math.sin(elapsed * 1.5) * 0.03;

  // Animate DaVinci monitor canvas
  updateScreenTexture();
  screenTexture.needsUpdate = true;

  // Pulse internal lighting
  ledLightStrip.material.color.setHSL(0.58, 0.9, 0.5 + Math.sin(elapsed * 3) * 0.15);

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
